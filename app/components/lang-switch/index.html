<div class="selector">
  <button class="trigger" data-ref="trigger" type="button" aria-haspopup="listbox" aria-controls="lista-idiomas" aria-expanded="false">
    <img class="flag" data-ref="flag" alt="" width="21" height="14" draggable="false" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" />
    <span class="nombre" data-ref="nombre"></span>
    <span class="corto" data-ref="corto"></span>
    <span class="chevron" aria-hidden="true"></span>
  </button>
  <div class="panel" data-ref="panel" hidden>
    <input class="search" data-ref="search" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar idioma" data-i18n-placeholder="lang.buscar" data-i18n-aria-label="lang.buscar" aria-label="Buscar idioma" />
    <div class="list" id="lista-idiomas" data-ref="list" role="listbox" aria-label="Idioma" data-i18n-aria-label="lang.etiqueta"></div>
    <p class="empty" data-ref="empty" data-i18n="lang.vacio" hidden>Sin resultados</p>
  </div>
</div>
