<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GACARBLA — tarjeta social</title>
<style>
@font-face{font-family:"Instrument Serif";src:url("/assets/fonts/instrument-serif.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Instrument Serif";src:url("/assets/fonts/instrument-serif-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url("/assets/fonts/jetbrains-mono.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block}

:root{
  --paper:#f3efe5;
  --paper-soft:#eae4d6;
  --ink:#181410;
  --ink-soft:#403a31;
  --muted:#6f6759;
  --line:rgba(24,20,16,.14);
  --accent:#bd4a12;
  --serif:"Instrument Serif",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:56px 64px 48px;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:24px;
}
.top{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:500;letter-spacing:.22em}
.mark{width:9px;height:9px;background:var(--accent)}
.coords{color:var(--muted);font-size:11px;letter-spacing:.16em}

.mid{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center}
.eyebrow{margin:0 0 18px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;background:var(--accent)}
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:104px;line-height:.9;letter-spacing:-.03em}
h1 em{font-style:italic}
h1 .p{color:var(--accent)}

.lens{width:100%;max-width:440px;justify-self:end;color:var(--ink)}
.lens-field{fill:var(--paper-soft);opacity:.35}
.lens-edge{fill:none;stroke:var(--line);stroke-width:1}
.rings circle{fill:none;stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--muted);stroke-width:1;opacity:.35}
.node-dot{fill:var(--accent)}
.node-label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;fill:var(--muted)}
.node-sub{font-family:var(--mono);font-size:10px;letter-spacing:.08em;fill:var(--muted)}
.center-ring{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 6}
.center-mark{font-family:var(--serif);font-size:26px;fill:var(--ink-soft)}
.tick{stroke:var(--muted);stroke-width:2;opacity:.45;stroke-linecap:round}

.foot{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.foot strong{color:var(--ink);font-weight:400;letter-spacing:.16em}
</style>
</head>
<body>
  <header class="top">
    <span class="brand"><span class="mark"></span>GACARBLA</span>
    <span class="coords">40.4168° N · 3.7038° W</span>
  </header>

  <div class="mid">
    <div>
      <p class="eyebrow"><span class="dot"></span>Índice de mundos / 2026</p>
      <h1>Un autor.<br><em>Muchos mundos<span class="p">.</span></em></h1>
    </div>

    <svg class="lens" viewBox="0 0 600 600" aria-hidden="true">
      <defs>
        <clipPath id="og-clip"><circle cx="300" cy="300" r="292"></circle></clipPath>
        <pattern id="og-dots" width="18" height="18" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="1" fill="currentColor" opacity=".2"></circle>
        </pattern>
        <radialGradient id="og-fade" cx="50%" cy="50%" r="50%">
          <stop offset=".5" stop-color="#fff" stop-opacity="1"></stop>
          <stop offset="1" stop-color="#fff" stop-opacity="0"></stop>
        </radialGradient>
        <mask id="og-mask"><rect width="600" height="600" fill="url(#og-fade)"></rect></mask>
      </defs>

      <circle class="lens-field" cx="300" cy="300" r="292"></circle>
      <g clip-path="url(#og-clip)">
        <rect width="600" height="600" fill="url(#og-dots)" mask="url(#og-mask)"></rect>
        <g class="rings">
          <circle cx="300" cy="300" r="150"></circle>
          <circle cx="300" cy="300" r="225" pathLength="48" stroke-dasharray="1 1"></circle>
        </g>
        <g>
          <path class="edge" d="M300 300 Q210 270 150 185"></path>
          <path class="edge" d="M300 300 Q390 250 445 205"></path>
          <path class="edge" d="M300 300 Q390 320 455 350"></path>
          <path class="edge" d="M300 300 Q350 380 380 445"></path>
          <path class="edge" d="M300 300 Q250 380 215 450"></path>
          <path class="edge" d="M300 300 Q210 320 140 330"></path>
          <path class="edge" d="M300 300 Q302 190 300 110"></path>
        </g>
        <g transform="translate(300 300)">
          <circle class="center-ring" r="26"></circle>
          <text class="center-mark" y="9" text-anchor="middle">G</text>
        </g>

        <g transform="translate(150 185)">
          <circle class="node-dot" r="5" style="--accent:#bd4a12"></circle>
          <text class="node-label" x="14" y="5">GAMES</text>
          <text class="node-sub" x="14" y="18">01</text>
        </g>
        <g transform="translate(445 205)">
          <circle class="node-dot" r="5" style="--accent:#a3213f"></circle>
          <text class="node-label" x="14" y="5">PLAY</text>
          <text class="node-sub" x="14" y="18">02</text>
        </g>
        <g transform="translate(455 350)">
          <circle class="node-dot" r="5" style="--accent:#2b4fbf"></circle>
          <text class="node-label" x="14" y="5">PORTFOLIO</text>
          <text class="node-sub" x="14" y="18">03</text>
        </g>
        <g transform="translate(380 445)">
          <circle class="node-dot" r="5" style="--accent:#16704f"></circle>
          <text class="node-label" x="14" y="5">CHAT</text>
          <text class="node-sub" x="14" y="18">04</text>
        </g>
        <g transform="translate(215 450)">
          <circle class="node-dot" r="5" style="--accent:#6b3fa0"></circle>
          <text class="node-label" x="14" y="5">EDU</text>
          <text class="node-sub" x="14" y="18">05</text>
        </g>
        <g transform="translate(140 330)">
          <circle class="node-dot" r="5" style="--accent:#0f6d78"></circle>
          <text class="node-label" x="14" y="5">MYWEB</text>
          <text class="node-sub" x="14" y="18">06</text>
        </g>
        <g transform="translate(300 110)">
          <text class="center-mark" y="7" text-anchor="middle" fill="#6f6759">?</text>
        </g>
      </g>
      <circle class="lens-edge" cx="300" cy="300" r="292"></circle>
      <line class="tick" transform="rotate(0 300 300)" x1="300" y1="1" x2="300" y2="15"></line>
      <line class="tick" transform="rotate(60 300 300)" x1="300" y1="1" x2="300" y2="15"></line>
      <line class="tick" transform="rotate(120 300 300)" x1="300" y1="1" x2="300" y2="15"></line>
      <line class="tick" transform="rotate(180 300 300)" x1="300" y1="1" x2="300" y2="15"></line>
      <line class="tick" transform="rotate(240 300 300)" x1="300" y1="1" x2="300" y2="15"></line>
      <line class="tick" transform="rotate(300 300 300)" x1="300" y1="1" x2="300" y2="15"></line>
    </svg>
  </div>

  <footer class="foot">
    <span><strong>gacarbla.es</strong> · un autor, muchos mundos</span>
    <span>portfolio · juegos · chat · edu · myweb</span>
  </footer>
</body>
</html>
