<div class="registro">
  <p class="meta">registro de mantenimiento · sin firmar</p>
  <ol class="poemas" data-ref="poemas"></ol>

  <section class="mesa" data-ref="mesa1" hidden>
    <p class="mesa-tit">cuatro respuestas, en el orden en que fueron escritas</p>
    <form data-ref="forma1">
      <input data-n="1" type="text" autocomplete="off" spellcheck="false" aria-label="primera" />
      <input data-n="2" type="text" autocomplete="off" spellcheck="false" aria-label="segunda" />
      <input data-n="3" type="text" autocomplete="off" spellcheck="false" aria-label="tercera" />
      <input data-n="4" type="text" autocomplete="off" spellcheck="false" aria-label="cuarta" />
      <button type="submit">abrir</button>
    </form>
    <p class="fallo" data-ref="fallo1" role="status"></p>
  </section>

  <section class="mesa" data-ref="mesa2" hidden>
    <p class="mesa-tit">cuatro respuestas de la cinta</p>
    <form data-ref="forma2">
      <input data-n="5" type="text" autocomplete="off" spellcheck="false" aria-label="quinta" />
      <input data-n="6" type="text" autocomplete="off" spellcheck="false" aria-label="sexta" />
      <input data-n="7" type="text" autocomplete="off" spellcheck="false" aria-label="séptima" />
      <input data-n="8" type="text" autocomplete="off" spellcheck="false" aria-label="octava" />
      <button type="submit">abrir</button>
    </form>
    <p class="fallo" data-ref="fallo2" role="status"></p>
  </section>

  <article class="desenlace" data-ref="desenlace" hidden></article>
</div>
