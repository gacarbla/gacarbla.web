name: Publicar web estática en la rama web

# Cada push a main construye el proyecto y sube el paquete web/
# (index.html + 404.html de fallback SPA + app/ + assets) a la RAÍZ
# de la rama "web" (página estática lista para servir en el dominio).
# Each push to main builds the project and uploads the web/ bundle
# (index.html + SPA-fallback 404.html + app/ + assets) to the ROOT of
# the "web" branch (static site ready to serve on the domain).

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: publicar-web
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar código / Checkout code
        uses: actions/checkout@v4

      - name: Instalar Node / Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias / Install dependencies
        run: npm ci

      - name: Construir / Build
        run: npm run build

      - name: Publicar en la rama web / Publish to the web branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web
          publish_dir: ./web
          force_orphan: true
          cname: gacarbla.es
