<style>
/* CSS crítico inline: pinta la primera vista sin esperar al JS.
   Copia mínima de src/layouts/main + componentes (ver esos ficheros). */
:root{--paper:#faf8f4;--ink:#17150f;--muted:#6b6455;--line:#e5ded2;--accent:#b3541e;--card:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#14110c;--ink:#f2ede3;--muted:#a89e8a;--line:#2e2a24;--accent:#e08a4c;--card:#1d1913}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;padding-top:var(--header-h,76px)}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.1;letter-spacing:-.02em}
#contenido{max-width:68rem;width:100%;box-sizing:border-box;margin:0 auto;padding:0 1.2rem 5rem;flex:1;min-height:100vh;min-height:100dvh}
page{display:block}
nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:.9rem 1.4rem;border-bottom:1px solid var(--line)}
nav .links{display:flex;gap:.25rem}
#burger{display:none}
.hero{padding:clamp(3rem,10vw,7rem) 0 clamp(2rem,6vw,4rem)}
.eyebrow{font-family:ui-monospace,monospace;font-size:.85rem;text-transform:uppercase;letter-spacing:.2em;color:var(--accent)}
.hero h1{font-size:clamp(2.8rem,8vw,5.5rem);margin:0 0 .5rem}
.rol{font-size:clamp(1.2rem,3vw,1.7rem);font-weight:600}
.lede{font-size:1.15rem;max-width:34rem;color:var(--muted)}
.ctas{display:flex;gap:.8rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.8rem 1.8rem;border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;border-top:1px solid var(--line);padding-top:2rem}
.stats dd{font-size:clamp(2rem,5vw,3rem);font-weight:700;color:var(--accent);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1.2rem}
.cards article{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.6rem}
footer{padding:2.5rem 1.2rem 3rem;text-align:center}
.langs{position:fixed;left:.8rem;bottom:.8rem;display:flex;gap:.4rem}
a{color:var(--accent)}
.rtw-view{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.rtw-view #contenido{flex:1}
</style>
</head>
<body>
<!--
  Snapshot estático del layout inicio (= src/layouts/main/index.html con
  componentes expandidos). Da FCP/LCP inmediato y contenido sin JS;
  el router lo toma como vista saliente y lo sustituye en vivo.
-->
<app><div class="rtw-view">
<nav>
  <a class="brand" href="/" data-go="inicio">GACARBLA</a>
  <button id="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Menú"><span></span><span></span><span></span></button>
  <div class="links" id="menu">
    <a href="/" data-go="inicio">Inicio</a>
    <a href="/experiencia" data-go="experiencia">Experiencia</a>
    <a href="/contacto" data-go="contacto">Contacto</a>
  </div>
</nav>
<main id="contenido">
  <section class="hero">
    <p class="eyebrow">Portfolio personal</p>
    <h1>GACARBLA</h1>
  </section>
</main>
<x-juego></x-juego>
<footer><small>© <span>Gabriel</span> — <span>2026</span></small></footer>
<div class="langs" role="group" aria-label="Idioma / Language"><button type="button">ES</button><button type="button">EN</button><button type="button">GL</button></div>
</div></app>
<script type="module" src="/app/index.js"></script>
</body>
